<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSec Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #00ff41; position: relative; overflow: hidden; }
        .matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.05; z-index: 0; }
        .container { background: rgba(0, 20, 40, 0.95); padding: 50px; border-radius: 15px; box-shadow: 0 0 40px rgba(0, 255, 65, 0.4); border: 2px solid #00ff41; width: 90%; max-width: 800px; position: relative; z-index: 1; animation: slideIn 0.5s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        .header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 36px; text-shadow: 0 0 15px #00ff41; animation: glow 2s ease-in-out infinite; margin-bottom: 10px; }
        @keyframes glow { 0%, 100% { text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41; } 50% { text-shadow: 0 0 20px #00ff41, 0 0 30px #00ff41, 0 0 40px #00ff41; } }
        .subtitle { color: #aaa; font-size: 16px; margin-bottom: 20px; }
        .service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 40px; }
        .service-item { background: rgba(0, 0, 0, 0.5); border: 1px solid #00ff41; border-radius: 12px; padding: 30px; text-align: center; text-decoration: none; color: #00ff41; transition: all 0.3s; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .service-item:hover { background: rgba(0, 255, 65, 0.1); transform: translateY(-10px); box-shadow: 0 10px 30px rgba(0, 255, 65, 0.4); border-color: #00ff41; }
        .service-item img { height: 60px; width: auto; margin-bottom: 20px; filter: brightness(0) invert(1); opacity: 0.8; transition: all 0.3s; }
        .service-item:hover img { opacity: 1; filter: brightness(0) invert(1) drop-shadow(0 0 10px #00ff41); }
        .service-item span { font-size: 18px; font-weight: bold; color: #00ff41; }
        .divider { height: 2px; background: linear-gradient(to right, transparent, #00ff41, transparent); margin: 30px 0; }
        .status-bar { background: rgba(0, 255, 65, 0.1); border: 1px solid #00ff41; padding: 15px; border-radius: 8px; text-align: center; font-size: 14px; }
        .status-bar::before { content: '🔐 '; }
        @media (max-width: 768px) { .service-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <canvas class="matrix-bg" id="matrix"></canvas>
    <div class="container">
        <div class="header">
            <h1 id="title">⚡ WELCOME AGENT ⚡</h1>
            <p class="subtitle">ACCESS GRANTED | SELECT YOUR DESTINATION</p>
        </div>

        <div class="divider"></div>

        <div class="service-grid">
            <a href="https://www.google.com" class="service-item" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" alt="Google">
                <span>GOOGLE</span>
            </a>

            <a href="https://www.youtube.com" class="service-item" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube">
                <span>YOUTUBE</span>
            </a>

            <a href="https://openai.com/chatgpt" class="service-item" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg" alt="ChatGPT">
                <span>CHATGPT</span>
            </a>
        </div>

        <div class="divider"></div>

        <div class="status-bar">
            SECURE CONNECTION ESTABLISHED | ALL SYSTEMS OPERATIONAL
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = 'rgba(10, 14, 39, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff41';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        let params = new URLSearchParams(window.location.search);
        let user = params.get("user");
        if(user) {
            document.getElementById("title").innerText = "⚡ WELCOME " + user.toUpperCase() + " ⚡";
        }
    </script>
</body>
</html>
